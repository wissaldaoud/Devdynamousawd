server:
  port: 8090
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/UserPI?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/microservices-realm
          jwk-set-uri: http://keycloak:8080/realms/microservices-realm/protocol/openid-connect/certs




security:
  jwt:
    secret: ${JWT_SECRET:Y6ThdM9XcJb35ZBYzLH7HhT7dwFDAJ0dUVZn7pa9JIE=}
    expiration-ms: 86400000




logging:
  level:
    org:
      springframework:
        web: DEBUG
        security: DEBUG
        "": DEBUG
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    com:
      saifeddine: DEBUG



# Keycloak Admin Client Configuration
keycloak:
  realm: microservices-realm
  auth-server-url: http://keycloak:8080
  admin:
    client-id: admin-cli
    username: admin
    password: admin


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  clustering:
    clusterDescriptions:
      - "Profil technique orienté Informatique et Data Science"
      - "Profil business orienté Finance et Marketing"
      - "Profil académique orienté Éducation et Recherche"

